[project]
name = "brawl"
version = "0.1.0"
description = "deep ML"
readme = "README.md"
authors = [{ name = "Simon Walker", email = "simon@simonwalker.tech" }]
requires-python = ">=3.13"
dependencies = [
  "einx>=0.4.3",
  "equinox>=0.13.8",
  "httpx>=0.28.1",
  "jax>=0.11.1",
  "jax2onnx>=0.16.1",
  "jax[cuda]>=0.11.1 ; sys_platform == 'linux'",
  "jaxtyping>=0.3.11",
  "jpc",
  "matplotlib>=3.11.1",
  "numpy>=2.5.2",
  "onnx>=1.23.0",
  "optax>=0.2.8",
  "plotext>=6.0.0",
  "prompt-toolkit>=3.0.53",
  "pytest>=9.1.1",
  "rich>=15.0.0",
  "scikit-learn>=1.9.0",
  "scipy>=1.18.1",
  "scipy-stubs>=1.18.1.0",
  "seaborn>=0.13.2",
  "statistics>=1.0.3.5",
  "tqdm>=4.70.0",
  "typer>=0.27.1",
]

[project.scripts]
crawl = "crawl.main:main"
geneus = "geneus.train:main"
pick = "pick.main:entrypoint"
draft-train = "geneus.draft.train:main"
export-onnx = "pick.export_onnx:entrypoint"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["crawl", "geneus", "pick"]

[tool.uv.sources]
jpc = { git = "https://github.com/simondoesstuff/jpc" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/integration"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "onnxruntime>=1.30.0",
    "pytest-httpx>=0.36.2",
]
